---
name: e2e

# Issue #3: Nextflow + nf-ga4gh runs a real pipeline on a tesp-api + Pulsar stack, behind nginx at /tes/ with
# basic auth, like on a TESP workspace. Needs no secrets; every credential in tests/e2e is a throwaway test value.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The tesp-api commit TESP-src pins.
      TESP_API_REF: 2d8496a0b5e04fa9b7723cd56e06d1c3343f9083
      # tesp-api's own compose file plus our basic-auth override (paths relative to the tesp-api checkout).
      COMPOSE_FILE: docker-compose.yaml:../tests/e2e/compose.basic-auth.yaml
      NXF_VER: 26.04.0
      NXF_ANSI_LOG: "false"
      TES_ENDPOINT: http://localhost:8088/tes
      # Throwaway test values, the only copy: compose.basic-auth.yaml and render-config.yml read them from here.
      # The password has a quote, a backslash, `${` and base64 characters, so a run proves the Groovy escaping
      # of the rendered config end to end.
      TES_USER: tes
      TES_PASSWORD: tEsP'e2e\${x}+/Pa55w0rd==
      NF_WORKDIR: s3://tesp-test/work
      # tesp-api's MinIO test service and its credentials (tesp-api docker-compose.yaml). The docker bridge
      # address, not localhost: the presigned URLs must work both from the runner (Nextflow) and from the
      # staging containers Pulsar starts.
      S3_ENDPOINT_URL: http://172.17.0.1:9000
      S3_ACCESS_KEY_ID: tesp-test
      S3_SECRET_ACCESS_KEY: tesp-test-secret
      # Nextflow reads $NXF_HOME/config, which the login script seeds below.
      NXF_HOME: ${{ github.workspace }}/../nxf-home
    steps:
      - name: check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: check out tesp-api
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mirelaminkova/tesp-api
          ref: ${{ env.TESP_API_REF }}
          path: tesp-api
          persist-credentials: false

      - name: start compose stack
        working-directory: tesp-api
        run: docker compose --profile pulsar up -d --build

      - name: start nginx
        run: |
          docker run -d --name tes-nginx --network host \
            -v "$PWD/tests/e2e/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine

      - name: set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: install ansible-core
        # Same version as in ci.yml and .pre-commit-config.yaml.
        run: pip install "ansible-core==2.21.5"

      - name: render the catalog item's config and seed it like a login does
        run: |
          mkdir -p "$RUNNER_TEMP/etc"
          ansible-playbook -i localhost, -c local tests/e2e/render-config.yml -e out="$RUNNER_TEMP/etc/tesp.config"
          # Source the login script non-interactively: it seeds $NXF_HOME/config, then returns before EESSI.
          NEXTFLOW_TESP_CONFIG="$RUNNER_TEMP/etc/tesp.config" bash -c '. "$1"' bash ansible/plugin-EESSI/files/eessi_nextflow.sh
          cat "$NXF_HOME/config"

      - name: set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          # EESSI's Nextflow/26.04.0 module runs on Java 25.
          java-version: "25"

      - name: install Nextflow
        # The self-contained release asset, checked against the SHA-256 that EESSI's easyconfig
        # (easybuild-easyconfigs Nextflow-26.04.0.eb) pins for the same file.
        env:
          NXF_DIST_SHA256: 5e2b4a354b4d7634d7211b71417d61606878fb49e9b224b50ded6e2c69114870
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/nf-logs"
          curl -fsSL -o "$RUNNER_TEMP/bin/nextflow" \
            "https://github.com/nextflow-io/nextflow/releases/download/v${NXF_VER}/nextflow-${NXF_VER}-dist"
          echo "${NXF_DIST_SHA256}  $RUNNER_TEMP/bin/nextflow" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/nextflow"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/nextflow" -version

      # The two wait loops are copied from tesp-api's .github/workflows/ci.yaml at TESP_API_REF.
      - name: wait for tesp-api
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/v1/service-info; then
              echo "tesp-api is up"
              exit 0
            fi
            sleep 5
          done
          echo "tesp-api did not answer on :8080 within 5 minutes" >&2
          exit 1

      - name: wait for pulsar
        working-directory: tesp-api
        run: |
          for _ in $(seq 1 60); do
            # Any HTTP response means Pulsar is listening.
            if docker compose --profile pulsar exec -T pulsar_rest curl -sS -o /dev/null http://localhost:8913/; then
              echo "pulsar is up"
              exit 0
            fi
            sleep 5
          done
          echo "pulsar did not answer on :8913 within 5 minutes" >&2
          exit 1

      - name: wait for minio
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://172.17.0.1:9000/minio/health/ready; then
              echo "minio is up"
              exit 0
            fi
            sleep 5
          done
          echo "minio did not answer on 172.17.0.1:9000 within 5 minutes" >&2
          exit 1

      - name: check nginx proxy and basic auth
        run: bash tests/e2e/check-proxy-auth.sh "$TES_ENDPOINT" "$TES_USER" "$TES_PASSWORD"

      - name: run pipeline
        working-directory: tests/e2e
        run: nextflow -log "$RUNNER_TEMP/nf-logs/e2e.nextflow.log" run main.nf --outdir "$RUNNER_TEMP/results"

      - name: check published result
        run: |
          ls -l "$RUNNER_TEMP/results"
          diff -u tests/e2e/expected-result.txt "$RUNNER_TEMP/results/result.txt"

      - name: check the tasks ran on TES
        # Without this, a config that silently fell back to the local executor would produce the same result.
        run: |
          curl -fsS -u "$TES_USER:$TES_PASSWORD" "$TES_ENDPOINT/v1/tasks?view=MINIMAL" |
            python3 -c '
          import json, sys
          states = [t["state"] for t in json.load(sys.stdin).get("tasks", [])]
          print("TES task states:", states)
          sys.exit(0 if states.count("COMPLETE") >= 2 else "expected at least 2 COMPLETE TES tasks")
          '

      - name: negative check (wrong password)
        working-directory: tests/e2e
        run: bash run-negative.sh "$RUNNER_TEMP/nf-logs"

      - name: dump logs on failure
        if: failure()
        run: bash tests/e2e/dump-debug.sh tesp-api "$RUNNER_TEMP/nf-logs" "$TES_USER" "$TES_PASSWORD"
