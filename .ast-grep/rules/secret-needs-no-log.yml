---
id: secret-needs-no-log
language: yaml
severity: error
message: >-
  This task uses a password or secret variable. Add `no_log: true` so the value
  doesn't end up in Ansible output or SRC deployment logs.
rule:
  kind: block_mapping
  # A task: it has a name and is not a play or a block.
  has:
    kind: block_mapping_pair
    has: {field: key, regex: '^name$'}
  all:
    - has:
        kind: block_mapping_pair
        stopBy: end
        regex: '\{\{[^}]*(password|secret)[^}]*\}\}'
    - not:
        has:
          kind: block_mapping_pair
          has: {field: key, regex: '^(no_log|hosts|tasks|block|rescue|always)$'}
