---
id: secret-needs-no-log
language: yaml
severity: error
message: >-
  This task uses a password, secret, token or key variable. Add `no_log: true` so the value
  doesn't end up in Ansible output or SRC deployment logs.
rule:
  kind: block_mapping
  # A task: it has a name and is not a play or a block.
  has:
    kind: block_mapping_pair
    has: {field: key, regex: '^name$'}
  all:
    - has:
        kind: block_mapping_pair
        stopBy: end
        regex: '\{\{[^}]*(password|passwd|secret|token|_pw\b|access_key)[^}]*\}\}'
    # Plays and blocks are not tasks. A task-level `no_log` must be literally
    # true; a block-level no_log is not recognised, so set it on the task.
    - not:
        has:
          kind: block_mapping_pair
          has: {field: key, regex: '^(hosts|tasks|block|rescue|always)$'}
    - not:
        has:
          kind: block_mapping_pair
          all:
            - has: {field: key, regex: '^no_log$'}
            - has: {field: value, regex: '^(true|yes|True)$'}
