---
id: secret-needs-no-log
valid:
  - |
    - name: Write config
      no_log: true
      ansible.builtin.copy:
        dest: /etc/x
        content: "{{ src_tes_password }}"
  - |
    - name: Play
      hosts: localhost
      tasks:
        - name: Write config
          no_log: true
          ansible.builtin.template:
            src: x.j2
            dest: "{{ src_s3_secret_access_key | length }}"
  - |
    - name: No secrets here
      ansible.builtin.copy:
        dest: /etc/x
        content: "{{ src_tes_endpoint }}"
invalid:
  - |
    - name: Write config
      ansible.builtin.copy:
        dest: /etc/x
        content: |
          tes { basicPassword = '{{ src_tes_password }}' }
  - |
    - name: Play
      hosts: localhost
      tasks:
        - name: Set facts
          ansible.builtin.set_fact:
            key: "{{ src_s3_secret_access_key }}"
