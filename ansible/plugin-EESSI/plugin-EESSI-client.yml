---
- name: Configure node for access to the EESSI stack
  hosts: localhost
  gather_facts: true
  vars_files:
    - vars/tes.yml
  tasks:
    - name: Validate the component parameters before installing anything
      ansible.builtin.include_tasks: tasks/validate-parameters.yml

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - sudo
          - wget
          - lmod
        state: present
        update_cache: true

    - name: Download EESSI installation script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/EESSI/eessi-demo/23da78bd7cc56332cceb9567bf67be637af91946/scripts/install_cvmfs_eessi.sh
        dest: /tmp/install_cvmfs_eessi.sh
        mode: '0755'

    - name: Execute the EESSI installation script
      ansible.builtin.shell: /tmp/install_cvmfs_eessi.sh
      args:
        executable: /bin/bash
      changed_when: true

    - name: Verify cvmfs_talk command
      # `command -v` is a shell builtin.
      ansible.builtin.shell: "command -v cvmfs_talk"  # noqa: command-instead-of-shell
      register: cvmfs_talk_output
      changed_when: false
      failed_when: false

    - name: Fail if cvmfs_talk command not found
      ansible.builtin.fail:
        msg: "'cvmfs_talk' command is not available. EESSI client installation failed."
      when: cvmfs_talk_output.rc != 0

    - name: Add private Stratum 1 to list of Stratum 1s
      when: src_stratum1_host is defined
      block:
        - name: Copy domain template
          ansible.builtin.copy:
            src: files/template-eessi-hpc.org.local
            dest: /etc/cvmfs/domain.d/eessi-hpc.org.local
            force: true
            mode: '0664'

        - name: Substitute template variables with values
          ansible.builtin.replace:
            path: /etc/cvmfs/domain.d/eessi-hpc.org.local
            regexp: "{{ item.variable }}"
            replace: "{{ item.value }}"
          loop:
            - {variable: "_src_stratum1_host_", value: "{{ src_stratum1_host }}"}

        - name: Update EESSI configuration
          ansible.builtin.command: cvmfs_config probe pilot.eessi-hpc.org
          changed_when: true

        - name: Probe Stratum 1 servers by geo location
          ansible.builtin.command: cvmfs_talk -i pilot.eessi-hpc.org host probe geo
          changed_when: true

- name: Deploy EESSI Nextflow environment initialization
  hosts: localhost
  become: true
  gather_facts: true
  vars_files:
    - vars/tes.yml
  tasks:
    - name: Install the login script that loads Nextflow from EESSI
      ansible.builtin.copy:
        src: files/eessi_nextflow.sh
        dest: /etc/profile.d/eessi_nextflow.sh
        mode: '0644'
        owner: root
        group: root

    - name: Ensure /etc/nextflow exists
      ansible.builtin.file:
        path: /etc/nextflow
        state: directory
        mode: '0755'

    - name: Deploy the Nextflow TESP config
      # Holds the TES password and S3 key pair. World-readable because every
      # user's ~/.nextflow/config includes it: everyone who can log in to this
      # workspace is a member of the CO, the same people who can open the TESP
      # welcome page that shows these credentials.
      no_log: true
      ansible.builtin.template:
        src: templates/tesp.config.j2
        dest: "{{ nf_tesp_config }}"
        mode: '0644'
        owner: root
        group: root

    - name: Remove the config file written by earlier versions
      ansible.builtin.file:
        path: /etc/nextflow/nextflow.config
        state: absent
