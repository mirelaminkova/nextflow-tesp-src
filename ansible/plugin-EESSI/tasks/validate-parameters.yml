---
# Rejects invalid component parameters before anything is installed. Values
# end up in Groovy string literals, so URLs and names get strict patterns and
# secrets may not hold control characters (the template escapes ' and \).
# Patterns end in \Z, not $: $ also matches before a trailing newline.
#
# Facts that look at secrets are computed with no_log, so the asserts below
# can show which parameter is wrong without printing values.
- name: Check the secret parameters
  ansible.builtin.set_fact:
    nf_tes_password_ok: >-
      {{ nf_tes_password | length > 0
         and nf_tes_password is not search('[\x00-\x1f\x7f]') }}
    nf_s3_has_secret_key: "{{ nf_s3_secret_access_key | length > 0 }}"
    nf_s3_keys_ok: >-
      {{ (nf_s3_access_key_id ~ nf_s3_secret_access_key) is not search('[\x00-\x1f\x7f]') }}
  no_log: true

- name: Check src_tes_endpoint, src_tes_username, src_tes_password, src_nf_workdir
  when: nf_tes_enabled | bool
  vars:
    # Ports 1-65535.
    port_re: '(:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?'
    path_re: '(/[A-Za-z0-9._~/-]*)?'
  block:
    - name: Check src_tes_endpoint
      ansible.builtin.assert:
        that: >-
          nf_tes_endpoint is match('https://[A-Za-z0-9.-]+' ~ port_re ~ path_re ~ '\Z')
          or nf_tes_endpoint is match('http://(localhost|127\.0\.0\.1)' ~ port_re ~ path_re ~ '\Z')
        fail_msg: >-
          src_tes_endpoint must be an https:// URL without credentials, query
          or quotes, e.g. https://<tesp-workspace>/tes (plain http:// only for
          localhost: the Basic auth password would cross the network unencrypted).
        quiet: true

    - name: Check src_tes_username
      ansible.builtin.assert:
        that: nf_tes_username is match('[A-Za-z0-9._-]+\Z')
        fail_msg: src_tes_username may only hold letters, digits, '.', '_' and '-'.
        quiet: true

    - name: Check src_tes_password
      ansible.builtin.assert:
        that: nf_tes_password_ok | bool
        fail_msg: src_tes_password is required with src_tes_endpoint and may not hold control characters.
        quiet: true

    - name: Check src_nf_workdir
      ansible.builtin.assert:
        that: nf_workdir is match('s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9](/[A-Za-z0-9._~-]+)+/?\Z')
        fail_msg: >-
          src_nf_workdir is required with src_tes_endpoint: s3://<bucket>/<prefix>,
          for example s3://my-bucket/nextflow/work. TESP stages task files by
          URL, so a local work directory can't work.
        quiet: true

- name: Check src_s3_endpoint_url
  ansible.builtin.assert:
    that: >-
      nf_s3_endpoint_url == ''
      or nf_s3_endpoint_url is match('https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?\Z')
    fail_msg: >-
      src_s3_endpoint_url must be empty (AWS S3) or an http:// or https:// URL
      with a host and optional port and path, such as https://s3.example.org.
    quiet: true

- name: Check src_s3_region
  ansible.builtin.assert:
    that: nf_s3_region is match('[A-Za-z0-9_-]+\Z')
    fail_msg: src_s3_region may only contain letters, digits, _ and -.
    quiet: true

# Without an endpoint the AWS SDK sends requests to s3.<region>.amazonaws.com,
# so a region like Ceph's 'default' fails only at the first `nextflow run`.
# AWS region names look like eu-west-1, us-gov-west-1 or eusc-de-east-1.
- name: Check src_s3_endpoint_url against src_s3_region
  when: nf_tes_enabled | bool
  ansible.builtin.assert:
    that: >-
      nf_s3_endpoint_url != ''
      or nf_s3_region is match('[a-z]{2,4}(-[a-z]+)+-[0-9]+\Z')
    fail_msg: >-
      src_s3_endpoint_url is required unless src_s3_region is an AWS region
      such as eu-west-1: without it, S3 requests go to s3.<region>.amazonaws.com.
      Use the same endpoint as TESP's src_s3_endpoint_url.
    quiet: true

- name: Check src_s3_addressing_style
  ansible.builtin.assert:
    that: nf_s3_addressing_style in ['path', 'virtual', 'auto']
    fail_msg: src_s3_addressing_style must be path, virtual or auto.
    quiet: true

- name: Check src_s3_access_key_id and src_s3_secret_access_key
  ansible.builtin.assert:
    that:
      - (nf_s3_access_key_id != '') == (nf_s3_has_secret_key | bool)
      - nf_s3_keys_ok | bool
    fail_msg: >-
      Set both src_s3_access_key_id and src_s3_secret_access_key or neither,
      without control characters.
    quiet: true
