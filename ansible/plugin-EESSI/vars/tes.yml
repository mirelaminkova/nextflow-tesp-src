---
# TESP connection settings, derived from the SRC component parameters
# (README: "Connecting to TESP"). Values are trimmed first, so a blank
# parameter counts as unset; the src_s3_* rules match TESP-src's.
nf_tes_endpoint: >-
  {{ src_tes_endpoint | default('') | trim | regex_replace('/+$', '') }}
nf_tes_enabled: "{{ nf_tes_endpoint | length > 0 }}"
nf_tes_username: "{{ src_tes_username | default('') | trim | default('tes', true) }}"
nf_tes_password: "{{ src_tes_password | default('') | trim }}"
nf_workdir: "{{ src_nf_workdir | default('') | trim }}"
nf_s3_endpoint_url: "{{ src_s3_endpoint_url | default('') | trim }}"
nf_s3_region: "{{ src_s3_region | default('') | trim | default('us-east-1', true) }}"
nf_s3_access_key_id: "{{ src_s3_access_key_id | default('') | trim }}"
nf_s3_secret_access_key: "{{ src_s3_secret_access_key | default('') | trim }}"
nf_s3_addressing_style: >-
  {{ src_s3_addressing_style | default('') | trim | default('path', true) }}

# nf-ga4gh 1.4.0 and later need Nextflow 25.10 or later. 1.5.0 is the version
# the e2e test (tests/e2e) runs on TESP with Nextflow 26.04.0.
nf_ga4gh_version: "1.5.0"
# Read by every user's Nextflow config through includeConfig. The login
# script (files/eessi_nextflow.sh) has the same default path.
nf_tesp_config: /etc/nextflow/tesp.config

# Who may read nf_tesp_config (issue #7). SRC puts every member of the
# workspace's CO in one POSIX group, rsc_co_<CO id> (GID = CO id), and keeps
# it in step with SRAM; service accounts are not in it. getent_group comes
# from the getent lookup in the playbook. Without exactly one such group (not
# on SRC, or SRC has no CO id), the config stays readable by every account,
# and tasks/check-config-group.yml refuses S3 keys.
nf_co_groups: >-
  {{ getent_group | default({}) | list | select('match', '^rsc_co_[0-9]+$') | sort | list }}
nf_tesp_config_group: "{{ nf_co_groups | first if nf_co_groups | length == 1 else '' }}"
nf_tesp_config_mode: "{{ '0640' if nf_tesp_config_group else '0644' }}"
# The template only writes the keys with TES on.
nf_tesp_config_has_s3_keys: "{{ nf_tes_enabled | bool and nf_s3_access_key_id | length > 0 }}"
