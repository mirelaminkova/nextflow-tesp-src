# Override for tesp-api's docker-compose.yaml (used through COMPOSE_FILE): turns on tesp-api's basic auth.
# Dynaconf reads TESP_API_* (envvar_prefix in tesp_api/config/properties.py); __ nests into basic_auth.* of
# settings.toml. The password has + / = in it, like a generated base64 password. Throwaway CI test value; keep it
# in sync with nextflow.config.
services:
  tesp-api:
    environment:
      - TESP_API_BASIC_AUTH__ENABLE=true
      - TESP_API_BASIC_AUTH__USERNAME=tes
      - TESP_API_BASIC_AUTH__PASSWORD=tEsP+e2e/Pa55w0rd==
