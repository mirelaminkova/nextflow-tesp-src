---
# Renders the TESP config with the catalog item's own validation, variables,
# CO group check, S3 check and template, from the e2e job's environment
# (throwaway CI values), as root (through sudo) with the playbook's owner,
# group and mode:
#
#   ansible-playbook -i localhost, -c local tests/e2e/render-config.yml -e out=<path>
- name: Render the catalog item's TESP config for the e2e job
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../ansible/plugin-EESSI/vars/tes.yml
  vars:
    plugin_dir: "{{ playbook_dir }}/../../ansible/plugin-EESSI"
    src_tes_endpoint: "{{ lookup('ansible.builtin.env', 'TES_ENDPOINT') }}"
    src_tes_username: "{{ lookup('ansible.builtin.env', 'TES_USER') }}"
    src_tes_password: "{{ lookup('ansible.builtin.env', 'TES_PASSWORD') }}"
    src_nf_workdir: "{{ lookup('ansible.builtin.env', 'NF_WORKDIR') }}"
    src_s3_endpoint_url: "{{ lookup('ansible.builtin.env', 'S3_ENDPOINT_URL') }}"
    src_s3_access_key_id: "{{ lookup('ansible.builtin.env', 'S3_ACCESS_KEY_ID') }}"
    src_s3_secret_access_key: "{{ lookup('ansible.builtin.env', 'S3_SECRET_ACCESS_KEY') }}"
    src_s3_addressing_style: path
  tasks:
    - name: Validate the parameters
      ansible.builtin.include_tasks: "{{ plugin_dir }}/tasks/validate-parameters.yml"

    - name: Look up the groups, to find the CO group
      ansible.builtin.getent:
        database: group

    - name: Check who will be able to read the config
      ansible.builtin.include_tasks: "{{ plugin_dir }}/tasks/check-config-group.yml"

    - name: Check the S3 key pair against the work directory
      ansible.builtin.include_tasks: "{{ plugin_dir }}/tasks/check-s3-access.yml"

    # Owner, group and mode as in the playbook's "Deploy the Nextflow TESP config".
    - name: Render the config
      no_log: true
      become: true
      ansible.builtin.template:
        src: "{{ plugin_dir }}/templates/tesp.config.j2"
        dest: "{{ out }}"
        mode: "{{ nf_tesp_config_mode }}"
        owner: root
        group: "{{ nf_tesp_config_group or 'root' }}"
