# Reverse proxy in front of tesp-api, as on a TESP workspace: http://localhost:8088/tes -> http://127.0.0.1:8080/
# Runs in a container on the host network, so 127.0.0.1:8080 is the port tesp-api's compose stack publishes.
server {
    listen 8088;

    location /tes/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
