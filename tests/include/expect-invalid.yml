---
# Runs the parameter validation with one invalid set of parameters
# (case.params) and fails unless the check for case.expect rejected it: any
# other failure (another check, a typo, an undefined variable) fails the test.
- name: "Validate: {{ case.why }}"
  block:
    - name: Run parameter validation
      ansible.builtin.include_tasks: "{{ plugin_dir }}/tasks/validate-parameters.yml"
      vars:
        src_tes_endpoint: "{{ case.params.src_tes_endpoint | default('') }}"
        src_tes_username: "{{ case.params.src_tes_username | default('') }}"
        src_tes_password: "{{ case.params.src_tes_password | default('') }}"
        src_nf_workdir: "{{ case.params.src_nf_workdir | default('') }}"
        src_s3_endpoint_url: "{{ case.params.src_s3_endpoint_url | default('') }}"
        src_s3_region: "{{ case.params.src_s3_region | default('') }}"
        src_s3_access_key_id: "{{ case.params.src_s3_access_key_id | default('') }}"
        src_s3_secret_access_key: "{{ case.params.src_s3_secret_access_key | default('') }}"
        src_s3_addressing_style: "{{ case.params.src_s3_addressing_style | default('') }}"

    - name: The validation should have failed
      ansible.builtin.fail:
        msg: "accepted invalid parameters: {{ case.why }}"
  rescue:
    - name: "Rejected by the check for {{ case.expect }}"
      ansible.builtin.assert:
        that: ansible_failed_result.msg | default('') is search(case.expect)
        fail_msg: "expected a {{ case.expect }} error, got: {{ ansible_failed_result.msg | default(ansible_failed_result) }}"
        quiet: true
